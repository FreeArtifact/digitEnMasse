<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Test Page</title>
    <!-- tutorial source: https://www.youtube.com/watch?v=XPhAR1YdD6o -->
    <style>body{margin:0;}</style>
    <script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
          "jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
        }
			}
		</script>
    <link rel="stylesheet" href="css/js-style.css">
</head>
<body>
    <header>
        <h1>Spin it</h1>
        <h1><a href="">Next Object</a></h1>
        <h1><a href="index.html">Return</a></h1>
    </header>
    <main>    
        <script type="module" src="js/testPage.js"></script>
        <!-- Eyeball that squishes and blinks -- comic shader -->
        <div class="left-side">
            <p>highlight <span class="subject">me</span></p>
            <fieldset>
                <legend>Click to Do Things:</legend>
                <input type="checkbox" id="CHARtoggle"/>
                <span>Subject</span>
                <input type="checkbox" id="SQtoggle"/>
                <span>Square</span>
                <!-- Several more checkboxes -->
            </fieldset>
            <!-- Thank you Hunor for the clock JS tutorial: https://www.youtube.com/watch?v=ULomsOSk4JA  -->
            <svg width="300" height="300" viewbox="-100 -100 200 200">
                <circle class="minute_marker" cx="0" cy="0" r="90" pathlength="60"/>
                <circle class="hour_marker" cx="0" cy="0" r="90" pathlength="60"/>
                
                <text id="watch_text" class="watch_text" x="45" y="5">00</text>

                <g id="hour_hand">
                  <line class="hand" x1="0" y1="0" x2="0" y2="-50"/>
                  <line class="hand hand--thick" x1="0" y1="-12" x2="0" y2="-50"/>
                </g>

                <g id="minute_hand">
                  <line class="hand" x1="0" y1="0" x2="0" y2="-80"/>
                  <line class="hand hand--thick" x1="0" y1="-12" x2="0" y2="-80"/>
                </g>

                <g id="second_hand">
                  <line class="hand hand--second" x1="0" y1="12" x2="0" y2="-80"/>
                </g>

                <circle class="center" r="3"/>
            </svg>
            <!-- Must be after svg build -->
            <script src="js/clock.js"></script>
        
        </div>    
        
    </main>
</body>
</html>
